server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # API calls go to the Express container. The real client IP is forwarded so
  # per-IP rate limits apply to users, not to nginx (the server sets TRUST_PROXY=1).
  location ~ ^/(api|v1|health) {
    proxy_pass http://server:4000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }
}
